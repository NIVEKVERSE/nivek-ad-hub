<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIVEK | AD_HUB</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#020617] text-white font-sans">
    
    <div id="root" class="min-h-screen flex items-center justify-center p-6">
        <div class="text-center">
            <div class="w-12 h-12 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <p class="text-cyan-500 font-bold tracking-widest animate-pulse">INITIALIZING NIVEK_UPLINK...</p>
        </div>
    </div>

    <script>
        // Direct Logic - No Babel needed
        const root = document.getElementById('root');

        function startAd() {
            let timeLeft = 15;
            root.innerHTML = `
                <div class="w-full max-w-md bg-slate-900 border border-white/10 rounded-3xl p-8 text-center shadow-2xl">
                    <div class="text-6xl font-light text-white mb-4 italic" id="timer">15s</div>
                    <div class="text-[10px] font-bold text-cyan-500 uppercase tracking-widest animate-pulse">Syncing Attention...</div>
                </div>
            `;
            
            const countdown = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft + "s";
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    showFinished();
                }
            }, 1000);
        }

        function showFinished() {
            root.innerHTML = `
                <div class="w-full max-w-md bg-slate-900 border border-white/10 rounded-3xl p-8 text-center shadow-2xl">
                    <div class="text-emerald-400 text-5xl mb-4">✓</div>
                    <h2 class="text-white font-bold uppercase mb-6">Extraction Complete</h2>
                    <button onclick="window.location.href='https://t.me/NivekAIBot'" class="w-full py-4 bg-cyan-500 text-white rounded-xl font-bold uppercase tracking-widest shadow-lg shadow-cyan-500/20">Return to Bot</button>
                </div>
            `;
        }

        // Initial View
        setTimeout(() => {
            root.innerHTML = `
                <div class="w-full max-w-md bg-slate-900 border border-white/10 rounded-3xl p-8 text-center shadow-2xl">
                    <h1 class="text-cyan-400 font-bold mb-6 tracking-widest uppercase">Nivek Uplink Active</h1>
                    <div class="aspect-video bg-black rounded-xl flex flex-col items-center justify-center border border-white/5 mb-8">
                        <button onclick="startAd()" class="bg-white text-black px-8 py-3 rounded-full font-bold hover:scale-105 transition-transform">START VERIFICATION</button>
                    </div>
                    <p class="text-[9px] text-slate-500 uppercase tracking-widest">Node: SECURE_STATION_01</p>
                </div>
            `;
        }, 1000);
    </script>
</body>
</html>
