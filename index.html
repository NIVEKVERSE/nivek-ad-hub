<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NIVEK | NEURAL_HUB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Fira+Code:wght@400;500&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; background: #020617; color: #94a3b8; user-select: none; -webkit-tap-highlight-color: transparent; }
        .cyber-card { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); }
        .mono { font-family: 'Fira Code', monospace; }
        .btn-glow { box-shadow: 0 0 20px rgba(6, 182, 212, 0.3); }
        .nav-active { color: #22d3ee; border-bottom: 2px solid #22d3ee; }
        @keyframes pulse-slow { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .animate-sync { animation: pulse-slow 2s infinite; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        const app = document.getElementById('app');
        
        // --- SYSTEM STATE ---
        const DB = {
            admin: { key: "889900", q: "First bot?", a: "nivek ai" },
            sessions: {}, // { id: { bot: "", status: "", expires: 0 } }
            ads: [
                { id: 1, type: "PAID", title: "NIVEK PREMIER", desc: "Unlock elite neural processing and ad-free extraction.", media: "https://images.unsplash.com/photo-1639762681485-074b7f938ba0?w=800", link: "#shop" },
                { id: 2, type: "INTERNAL", title: "JOIN ARCHIVE", desc: "Access the official NIVEK support and community node.", media: "https://images.unsplash.com/photo-1614850523296-d8c1af93d400?w=800", link: "https://t.me/NivekSupport" }
            ],
            bots: [{ id: "nv_ai", name: "NIVEK AI", user: "NivekAIBot" }]
        };

        let activeTimer = null;
        let isTabActive = true;

        // --- ROUTER ---
        function router() {
            const params = new URLSearchParams(window.location.search);
            const hash = window.location.hash;
            const sid = params.get('session');

            if (hash === '#admin') renderAdmin();
            else if (hash === '#shop') renderShop();
            else if (sid) renderAdPlayer(sid, params.get('bot'));
            else renderMarketplace();
        }

        // --- VIEWS ---
        function renderAdPlayer(sid, botId) {
            if (!DB.sessions[sid]) DB.sessions[sid] = { status: 'pending', time: 20 };
            const ad = DB.ads[Math.floor(Math.random() * DB.ads.length)];

            app.innerHTML = `
                <div class="min-h-screen p-6 flex flex-col items-center justify-center fade-in">
                    <div class="w-full max-w-sm cyber-card rounded-[2.5rem] p-6 relative">
                        <div id="clock" class="absolute top-6 right-6 mono text-xs bg-black/60 px-3 py-1 rounded-full border border-white/10 text-white">20s</div>
                        <div class="w-full aspect-video bg-black rounded-2xl mb-4 overflow-hidden border border-white/5">
                            <img src="${ad.media}" class="w-full h-full object-cover">
                        </div>
                        <h2 class="text-white font-bold uppercase italic tracking-tighter mb-1">${ad.title}</h2>
                        <p class="text-[10px] leading-relaxed mb-6 opacity-60">${ad.desc}</p>
                        <div class="space-y-3">
                            <button onclick="window.open('${ad.link}')" class="w-full py-4 bg-white/5 border border-white/10 rounded-2xl text-[10px] font-black uppercase tracking-widest text-white">Visit Source</button>
                            <button id="v-btn" disabled class="w-full py-4 bg-slate-800 text-slate-500 rounded-2xl text-[10px] font-black uppercase tracking-widest">Verify Extraction</button>
                        </div>
                        <div id="f-mask" class="hidden absolute inset-0 bg-slate-950/95 flex flex-col items-center justify-center text-center p-8 z-50 rounded-[2.5rem]">
                            <p class="text-rose-500 font-black italic uppercase mb-2">Focus Lost</p>
                            <p class="text-[9px] opacity-50 uppercase tracking-widest">Return to synchronize</p>
                        </div>
                    </div>
                </div>
            `;
            startLogic(sid, botId);
        }

        function startLogic(sid, botId) {
            let t = 20;
            const clock = document.getElementById('clock');
            const vBtn = document.getElementById('v-btn');
            const mask = document.getElementById('f-mask');

            document.addEventListener('visibilitychange', () => {
                isTabActive = !document.hidden;
                mask.classList.toggle('hidden', isTabActive);
            });

            activeTimer = setInterval(() => {
                if (isTabActive) {
                    t--;
                    clock.innerText = t + "s";
                    if (t <= 0) {
                        clearInterval(activeTimer);
                        vBtn.disabled = false;
                        vBtn.className = "w-full py-4 bg-cyan-500 text-white rounded-2xl text-[10px] font-black uppercase tracking-widest btn-glow";
                        vBtn.onclick = () => window.location.href = `https://t.me/${botId}?start=reward_${sid}`;
                    }
                }
            }, 1000);
        }

        function renderAdmin() {
            app.innerHTML = `
                <div class="min-h-screen p-8">
                    <div class="flex justify-between items-center mb-10">
                        <h1 class="text-3xl font-black text-white italic uppercase tracking-tighter underline decoration-cyan-500">Terminal</h1>
                        <button onclick="window.location.hash=''" class="text-[10px] font-bold opacity-30">EXIT</button>
                    </div>
                    <div class="grid grid-cols-2 gap-4 mb-8">
                        <div class="cyber-card p-6 rounded-3xl"><p class="text-[8px] uppercase font-bold text-slate-500 mb-1">Stars</p><p class="text-2xl text-white font-light">1,402</p></div>
                        <div class="cyber-card p-6 rounded-3xl"><p class="text-[8px] uppercase font-bold text-slate-500 mb-1">Users</p><p class="text-2xl text-cyan-400 font-light">892</p></div>
                    </div>
                    <nav class="fixed bottom-6 left-6 right-6 cyber-card rounded-2xl flex justify-around p-4">
                        <button class="text-cyan-400 text-[10px] font-bold uppercase tracking-widest">Intel</button>
                        <button onclick="window.location.hash='#shop'" class="text-[10px] font-bold uppercase tracking-widest">Shop</button>
                    </nav>
                </div>
            `;
        }

        function renderMarketplace() {
            app.innerHTML = `
                <div class="min-h-screen p-6 flex flex-col items-center justify-center">
                    <h1 class="text-2xl font-black text-white italic mb-8">NIVEK<span class="text-cyan-500">_NEXUS</span></h1>
                    <div class="w-full max-w-sm space-y-4">
                        ${DB.bots.map(b => `<div class="cyber-card p-5 rounded-3xl flex justify-between items-center"><div><p class="text-white font-bold text-xs">${b.name}</p></div><button onclick="window.location.href='https://t.me/${b.user}'" class="bg-white text-black px-4 py-2 rounded-xl text-[9px] font-black uppercase">Open</button></div>`).join('')}
                    </div>
                </div>
            `;
        }

        window.onhashchange = router;
        window.onload = router;
    </script>
</body>
</html>
